<title>Wireframe Cổng thực tập VIN-15</title>

<style>
/* Layout: mỗi màn là một tờ A4 ngang — khung tên trên cùng, desktop | mobile | chú thích, chân trang.
   Quy ước wireframe low-fi: thang xám thuần, một màu redline cho chú thích, nhãn chữ thật, thanh xám thay đoạn văn,
   ô X thay ảnh/avatar. Một giao diện duy nhất (giấy trắng) vì tài liệu để in/nộp — không có bản tối. */
:root {
  --paper: #ffffff;      /* tờ giấy */
  --desk: #e9e9e6;       /* nền bàn quanh các tờ (chỉ trên màn hình) */
  --ink: #1c1c1a;        /* chữ, viền đậm */
  --line: #8c8c87;       /* viền thành phần */
  --soft: #cfcfca;       /* viền mờ, thanh chữ */
  --fill: #ececea;       /* nền ô nhập, thẻ */
  --fill2: #f6f6f4;      /* nền vùng phụ */
  --red: #c4351d;        /* redline: số chú thích, ghi chú thiết kế */
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ---------- thanh công cụ (chỉ màn hình) ---------- */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--desk); padding-block: 12px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; max-width: 1123px; margin: 0 auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--desk); }
.toolbar b { font-size: 13px; }
.toolbar nav { display: flex; flex-wrap: wrap; gap: 4px; }
.toolbar nav a { font: 600 11px var(--f-mono); text-decoration: none; padding: 3px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); }
.toolbar nav a.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toolbar .hint { font-size: 12px; color: #55554f; }

/* ---------- tờ A4 ---------- */
.sheet { background: var(--paper); width: 100%; max-width: 1123px; margin: 0 auto 28px; box-shadow: 0 1px 3px rgba(0,0,0,.18);
  display: grid; grid-template-rows: auto 1fr auto; padding: 18px 22px 12px; gap: 12px; }
@media (min-width: 1000px) { .sheet { aspect-ratio: 297 / 210; } }
body.solo .sheet { display: none; }
body.solo .sheet.show { display: grid; }

.tb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.tb__id { font: 700 26px/1 var(--f-mono); letter-spacing: -.02em; }
.tb__name { font-size: 19px; font-weight: 700; }
.tb__purpose { font-size: 12px; color: #4b4b46; max-width: 62ch; margin-top: 2px; }
.tb__meta { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 14px; font-size: 10.5px; }
.tb__meta dt { color: #6a6a64; text-transform: uppercase; letter-spacing: .06em; font-size: 9px; }
.tb__meta dd { margin: 0 0 2px; font-weight: 600; }
.tb__meta .mono { font-family: var(--f-mono); font-weight: 500; }
.foot { display: flex; justify-content: space-between; gap: 12px; font-size: 9.5px; color: #6a6a64; border-top: 1px solid var(--soft); padding-top: 5px; }
.foot span:last-child { font-family: var(--f-mono); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 222px 236px; gap: 16px; min-height: 0; }
@media (max-width: 999px) { .body { grid-template-columns: 1fr; } .tb { grid-template-columns: 1fr; } .tb__meta { grid-template-columns: repeat(2, auto); } }
.col { display: flex; flex-direction: column; gap: 5px; min-height: 0; min-width: 0; }
.col__label { font: 700 9px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #6a6a64; }

/* ---------- khung thiết bị ---------- */
.dev { flex: 1; min-height: 0; border: 1.5px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.dev--desk { border-radius: 6px; }
.dev--phone { border-radius: 18px; border-width: 2px; max-width: 222px; }
@media (max-width: 999px) { .dev { flex: none; } .dev--desk { min-height: 420px; } .dev--phone { min-height: 520px; align-self: center; width: 222px; } }
.chrome { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--fill2); }
.chrome i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }
.chrome .url { flex: 1; font: 500 9px var(--f-mono); border: 1px solid var(--soft); border-radius: 3px; padding: 2px 6px; background: var(--paper); color: #55554f; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.status { display: flex; justify-content: space-between; padding: 6px 14px 2px; font: 600 7px var(--f-mono); color: #55554f; }
.vp { flex: 1; min-height: 0; overflow: hidden; container-type: inline-size; position: relative; }
.dev--desk .vp { font-size: 8.6px; }
.dev--phone .vp { font-size: 7.2px; }
.dev.cut::after { content: "↓ trang còn tiếp khi cuộn"; position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 0 4px; text-align: center;
  font: 600 8px var(--f-mono); color: var(--red); background: linear-gradient(transparent, var(--paper) 55%); }

/* ---------- chú thích ---------- */
.notes { flex: 1; border-left: 1px solid var(--soft); padding-left: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 999px) { .notes { border-left: 0; padding-left: 0; } }
.notes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; font-size: 10.2px; line-height: 1.38; }
.notes .n { width: 15px; height: 15px; border-radius: 50%; background: var(--red); color: #fff; font: 700 8.5px/15px var(--f-mono); text-align: center; }
.fr { font: 500 8.5px var(--f-mono); color: var(--red); white-space: nowrap; }
.notes .states { margin-top: auto; font-size: 9.5px; border-top: 1px dashed var(--soft); padding-top: 6px; color: #4b4b46; }
.notes .states b { color: var(--ink); }

/* ---------- thành phần wireframe (đơn vị em, co theo khung) ---------- */
.mk { display: inline-block; width: 1.75em; height: 1.75em; border-radius: 50%; background: var(--red); color: #fff;
  font: 700 1em/1.75em var(--f-mono); text-align: center; vertical-align: middle; margin: 0 .35em; flex: none; }
.dev--phone .mk { display: none; }
.app { display: grid; grid-template-columns: 15em minmax(0, 1fr); height: 100%; }
.side { border-right: 1px solid var(--line); padding: 1.6em 1.1em; display: flex; flex-direction: column; gap: 1.1em; background: var(--fill2); }
.brand { display: flex; align-items: center; gap: .7em; font-weight: 700; font-size: 1.15em; }
.x { display: inline-block; flex: none; border: 1px solid var(--line); background:
  linear-gradient(to top right, transparent calc(50% - .5px), var(--line) 50%, transparent calc(50% + .5px)),
  linear-gradient(to top left, transparent calc(50% - .5px), var(--line) 50%, transparent calc(50% + .5px)), var(--paper); }
.x--brand { width: 2.6em; height: 2.6em; border-radius: .4em; }
.x--av { width: 2.8em; height: 2.8em; border-radius: 50%; }
.x--img { width: 100%; border-radius: .3em; }
.nav { display: flex; flex-direction: column; gap: .3em; }
.nav span { display: flex; align-items: center; gap: .7em; padding: .65em .8em; border-radius: .35em; }
.nav span.on { background: var(--fill); font-weight: 700; box-shadow: inset .25em 0 0 var(--ink); }
.ic { width: 1.25em; height: 1.25em; border: 1.2px solid var(--line); border-radius: .2em; flex: none; display: inline-block; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: .4em; padding: .2em; gap: .2em; align-self: flex-start; }
.toggle i { width: 2.2em; height: 1.9em; border-radius: .3em; display: block; border: 1px solid var(--soft); }
.toggle i.on { border-color: var(--ink); }
.user { margin-top: auto; display: flex; align-items: center; gap: .7em; border: 1px solid var(--soft); border-radius: .4em; padding: .7em; background: var(--paper); }
.user small { display: block; color: #66665f; }
.main { padding: 1.4em 2.6em 2.4em; display: flex; flex-direction: column; gap: 1.3em; min-width: 0; }
.bell { align-self: flex-end; position: relative; width: 2.8em; height: 2.8em; border: 1px solid var(--line); border-radius: .5em; display: grid; place-items: center; }
.bell .ic { border-radius: 50% 50% .2em .2em; }
.bell b { position: absolute; top: -.5em; right: -.5em; min-width: 1.5em; height: 1.5em; border-radius: 1em; background: var(--ink); color: #fff; font-size: .8em; display: grid; place-items: center; }
.ph h1 { font-size: 2.3em; line-height: 1.1; }
.ph p { margin: .3em 0 0; color: #55554f; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; flex-wrap: wrap; }
.card { border: 1px solid var(--line); border-radius: .45em; padding: 1.3em 1.5em; display: flex; flex-direction: column; gap: 1em; background: var(--paper); }
.card__h { display: flex; justify-content: space-between; align-items: center; gap: 1em; }
.card__h h3 { font-size: 1.35em; display: flex; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .9em 1.3em; }
.f { display: flex; flex-direction: column; gap: .35em; min-width: 0; }
.f label { font-weight: 600; font-size: .92em; }
.inp { border: 1px solid var(--line); border-radius: .35em; min-height: 2.6em; padding: .55em .8em; color: #55554f; background: var(--paper);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; justify-content: space-between; gap: .5em; }
.inp.ta { min-height: 5em; align-items: flex-start; white-space: normal; }
.inp.sel::after { content: "▾"; color: var(--ink); }
.inp.ph-only { color: #9a9a94; }
.f.ai .inp { border-style: dashed; border-width: 1.5px; background: repeating-linear-gradient(-45deg, var(--paper) 0 .5em, var(--fill2) .5em 1em); }
.tag { font-size: .78em; font-weight: 700; border: 1px dashed var(--ink); border-radius: .3em; padding: 0 .4em; margin-left: .5em; }
.btns { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: .5em; min-height: 2.8em; padding: .5em 1.2em; border: 1.2px solid var(--ink); border-radius: .4em; font-weight: 600; background: var(--paper); white-space: nowrap; }
.btn--p { background: var(--ink); color: #fff; }
.btn--d { border-style: dashed; }
.btn--sm { min-height: 2.2em; padding: .3em .8em; font-size: .92em; }
.badge { display: inline-block; border: 1px solid var(--ink); border-radius: 1em; padding: .1em .7em; font-size: .85em; font-weight: 600; white-space: nowrap; background: var(--paper); }
.badge--fill { background: var(--fill); }
.alert { border: 1px solid var(--line); border-left: .4em solid var(--ink); border-radius: .35em; padding: .8em 1em; background: var(--fill2); }
.alert b { display: block; }
.next { border: 1.5px solid var(--ink); border-radius: .45em; padding: .9em 1.1em; display: flex; align-items: center; gap: .8em; font-weight: 600; }
.next .ic { width: 2em; height: 2em; }
.aibox { border: 1.5px dashed var(--ink); border-radius: .45em; padding: 1em 1.1em; background: repeating-linear-gradient(-45deg, var(--paper) 0 .6em, var(--fill2) .6em 1.2em);
  display: flex; flex-direction: column; gap: .5em; }
.aibox > b { font-size: .9em; }
.tbar { display: block; height: .7em; border-radius: .35em; background: var(--soft); }
.lines { display: flex; flex-direction: column; gap: .5em; padding-block: .2em; }
.small { font-size: .9em; color: #55554f; }
.muted { color: #77776f; }
.row { display: flex; gap: .8em; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6em 1.2em; }
.kv div span { display: block; font-size: .85em; color: #6a6a64; }
.kv div b { font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: .9em; padding-bottom: 1.1em; position: relative; }
.tl li::before { content: ""; position: absolute; left: 1.25em; top: 2.4em; bottom: 0; border-left: 2px solid var(--ink); }
.tl li.todo::before { border-left-style: dashed; border-left-color: var(--line); }
.tl li:last-child::before { display: none; }
.dot { width: 2.4em; height: 2.4em; border: 1.5px solid var(--ink); border-radius: .4em; display: grid; place-items: center; font-weight: 700; background: var(--paper); z-index: 1; }
.dot.done { background: var(--ink); color: #fff; }
.dot.cur { width: 2.8em; height: 2.8em; box-shadow: 0 0 0 .3em var(--fill); border-width: 2.5px; }
.tl .t { font-weight: 700; }
.tl li > .badge { align-self: start; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 1em; padding: .25em .8em; font-size: .9em; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl th { text-align: left; font-weight: 600; color: #55554f; border-bottom: 1.2px solid var(--ink); padding: .5em .6em; white-space: nowrap; }
.tbl td { border-bottom: 1px solid var(--soft); padding: .55em .6em; vertical-align: top; }
.tbl-wrap { overflow: hidden; }
.prog { display: block; width: 6em; height: .7em; border: 1px solid var(--ink); border-radius: .4em; background: linear-gradient(to right, var(--ink) var(--p), transparent var(--p)); }
.chat { display: flex; flex-direction: column; gap: .8em; }
.msg { max-width: 82%; border: 1px solid var(--line); border-radius: .6em; padding: .8em 1em; display: flex; flex-direction: column; gap: .5em; }
.msg--u { align-self: flex-end; background: var(--fill); border-color: var(--fill); }
.src { border-top: 1px dashed var(--line); padding-top: .5em; display: flex; flex-direction: column; gap: .3em; font-size: .9em; }
.src span::before { content: "▸ "; }
.panel { border: 1px solid var(--line); border-radius: .4em; padding: 1em; background: var(--fill2); display: flex; flex-direction: column; gap: .7em; }
.overlay { position: absolute; z-index: 5; right: 2.6em; top: 4.6em; width: 24em; border: 1.5px solid var(--ink); border-radius: .5em; background: var(--paper);
  box-shadow: .4em .4em 0 var(--fill); padding: .8em; display: flex; flex-direction: column; gap: .2em; }
.overlay .it { padding: .6em .5em; border-bottom: 1px solid var(--soft); }
.overlay .it.unread b { font-weight: 700; }
.scrim { position: absolute; inset: 0; background: rgba(255,255,255,.55); z-index: 4; }
.split { display: grid; grid-template-columns: 1.15fr 1fr; height: 100%; }
.split__hero { background: var(--fill); padding: 3em; display: flex; flex-direction: column; gap: 1.4em; border-right: 1px solid var(--line); }
.split__hero h1 { font-size: 3em; line-height: 1.08; max-width: 12ch; }
.split__form { padding: 3em 3.6em; display: flex; flex-direction: column; justify-content: center; gap: 1em; }
.path { height: 5em; border-bottom: 2px dashed var(--line); width: 70%; position: relative; }
.path i { position: absolute; bottom: -.7em; width: 1.4em; height: 1.4em; border: 1.5px solid var(--ink); background: var(--paper); border-radius: .3em; }

/* ---------- mobile: cùng nội dung, bố cục theo khung hẹp ---------- */
@container (max-width: 320px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 1.2em 1.4em; gap: .9em; display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .side .nav { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: .2em .4em; }
  .side .nav span { padding: .5em .6em; }
  .side .nav span.on { box-shadow: inset 0 -.25em 0 var(--ink); }
  .side .user { grid-column: 1 / -1; margin-top: 0; }
  .main { padding: 1.2em 1.4em 2em; }
  .grid2, .kv { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .split__hero { padding: 1.8em 1.6em; border-right: 0; border-bottom: 1px solid var(--line); }
  .split__hero h1 { font-size: 2.2em; }
  .split__hero .path, .split__hero .lines { display: none; }
  .split__form { padding: 2em 1.6em; justify-content: flex-start; }
  .msg { max-width: 92%; }
  .overlay { right: 1em; left: 1em; width: auto; top: 9em; }
  .hide-m { display: none !important; }
}

/* ---------- bìa & sơ đồ ---------- */
.cover { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 26px; min-height: 0; }
@media (max-width: 999px) { .cover { grid-template-columns: 1fr; } }
.cover h1 { font-size: 34px; line-height: 1.08; letter-spacing: -.01em; }
.cover p { margin: 0; font-size: 12.5px; max-width: 60ch; }
.cover .stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cover h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 11.5px; margin: 0; }
.facts dt { color: #6a6a64; } .facts dd { margin: 0; font-weight: 600; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; font-size: 10.5px; }
.legend > div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend .sw { flex: none; width: 46px; font-size: 7.5px; display: flex; justify-content: center; }
.index { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.index th { text-align: left; border-bottom: 1.5px solid var(--ink); padding: 3px 6px; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #55554f; }
.index td { border-bottom: 1px solid var(--soft); padding: 3px 6px; }
.index td:first-child { font-family: var(--f-mono); font-weight: 700; }
.index a { text-decoration: none; }
.index-wrap { overflow-x: auto; }
.howto { font-size: 10.8px; border: 1px dashed var(--line); padding: 8px 10px; border-radius: 4px; }
.howto ol { margin: 4px 0 0; padding-left: 18px; }
.flow-wrap { min-height: 0; overflow-x: auto; display: flex; flex-direction: column; gap: 10px; }
.flow-wrap svg { width: 100%; min-width: 760px; height: auto; display: block; }
.flow-wrap svg text { font-family: var(--f-ui); }
</style>

<div class="toolbar" id="toolbar">
  <b>Wireframe VIN-15</b>
  <nav id="toc" aria-label="Các tờ"></nav>

<div id="sheets"></div>

<script>
/* ===== Dữ liệu chung ===== */
const META = { project: "VIN-15 · Cổng thực tập (Hệ thống hỗ trợ thực tập bằng AI)", version: "1.0", date: "14/11/2026", fidelity: "Low-fi", source: "Frontend React (main c3e71ab) · PRD v0.5" };
const NAV = {
  student: ["Hồ sơ của tôi", "Nhật ký", "Trợ lý AI", "Quy định"],
  lecturer: ["Hàng chờ duyệt", "Sinh viên", "Cảnh báo", "Trợ lý AI", "Quy định"],
  admin: ["Quản trị", "Danh sách", "Quy định", "Trợ lý AI"],
};
const USERS = { student: ["Phạm Ngọc Dũng", "Sinh viên"], lecturer: ["TS. Đỗ Quốc Huy", "Giảng viên"], admin: ["Quản trị viên Đào tạo", "Quản trị viên"] };
const ROLE = { student: "Sinh viên", lecturer: "Giảng viên", admin: "Quản trị viên (tùy chọn)", any: "Mọi vai trò", guest: "Chưa đăng nhập" };

/* ===== Thành phần ===== */
const mk = (n) => `<span class="mk" aria-label="Chú thích ${n}">${n}</span>`;
const ic = () => `<span class="ic"></span>`;
const bar = (w) => `<span class="tbar" style="width:${w}%"></span>`;
const lines = (...ws) => `<div class="lines">${ws.map(bar).join("")}</div>`;
const btn = (t, v = "", n) => `<span class="btn ${v ? "btn--" + v : ""}">${n ? mk(n) : ""}${t}</span>`;
const badge = (t, fill) => `<span class="badge ${fill ? "badge--fill" : ""}">${t}</span>`;
const field = (label, val, o = {}) => `<div class="f ${o.ai ? "ai" : ""}" ${o.span ? 'style="grid-column:1/-1"' : ""}><label>${o.n ? mk(o.n) : ""}${label}${o.ai ? '<span class="tag">AI điền</span>' : ""}</label>
  <span class="inp ${o.ta ? "ta" : ""} ${o.sel ? "sel" : ""} ${o.ph ? "ph-only" : ""}">${val}</span></div>`;
const card = (title, body, right = "", n) => `<div class="card"><div class="card__h"><h3>${n ? mk(n) : ""}${title}</h3>${right}</div>${body}</div>`;
const ph = (t, sub = "", right = "", n) => `<div class="ph"><div><h1>${n ? mk(n) : ""}${t}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${right}</div>`;
const alertBox = (t, body, n) => `<div class="alert">${n ? mk(n) : ""}<b>${t}</b><span class="small">${body}</span></div>`;
const aibox = (body, n) => `<div class="aibox"><b>${n ? mk(n) : ""}✧ Gợi ý của AI — chỉ để tham khảo, GV là người quyết định</b>${body}</div>`;
const table = (heads, rows, n) => `<div class="tbl-wrap">${n ? mk(n) : ""}<table class="tbl"><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

function shell(role, active, content, opts = {}) {
  const [name, label] = USERS[role];
  const nav = NAV[role].map((t, i) => `<span class="${i === active ? "on" : ""}">${ic()}${t}</span>`).join("");
  return `<div class="app">
    <aside class="side">
      <div class="brand"><span class="x x--brand"></span>Cổng thực tập</div>
      <div class="toggle hide-d"><i class="on"></i><i></i><i></i></div>
      <nav class="nav">${nav}</nav>
      <div class="toggle hide-m-only"><i class="on"></i><i></i><i></i></div>
      <div class="user"><span class="x x--av"></span><div style="flex:1;min-width:0"><b>${name}</b><small>${label}</small></div>${ic()}</div>
    </aside>
    <main class="main">${opts.bell === false ? "" : `<div class="bell">${opts.bellMk ? mk(opts.bellMk) : ""}${ic()}<b>${opts.unread ?? 1}</b></div>`}${content}</main>
  </div>${opts.after || ""}`;
}

      <div class="it unread"><b>Hoàng Gia Giang xin gia hạn mốc ‘Nộp giấy xác nhận…’</b><div class="small muted">13/11/2026</div></div>
      <div class="it"><span>Đề cương mới chờ duyệt: Phạm Ngọc Dũng</span><div class="small muted">12/11/2026</div></div></div>` }),
},
];

/* ===== Sơ đồ (SVG vẽ tay theo toạ độ) ===== */
function box(x, y, w, h, label, sub, opt = {}) {
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${opt.fill || "#fff"}" stroke="#1c1c1a" stroke-width="${opt.bold ? 2 : 1.2}" ${opt.dash ? 'stroke-dasharray="5 4"' : ""}/>
    <text x="${x + w / 2}" y="${y + (sub ? h / 2 - 3 : h / 2 + 4)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1c1a">${label}</text>
    ${sub ? `<text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle" font-size="9.5" fill="#55554f">${sub}</text>` : ""}</g>`;
}
const arrow = (d, red) => `<path d="${d}" fill="none" stroke="${red ? "#c4351d" : "#1c1c1a"}" stroke-width="1.3" marker-end="url(#${red ? "ar" : "ak"})"/>`;
const lbl = (x, y, t, red, anchor = "middle") => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="9.5" fill="${red ? "#c4351d" : "#55554f"}">${t}</text>`;
const DEFS = `<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1c1a"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4351d"/></marker></defs>`;

function sitemapSVG() {
  const col = (x, title, items, ids) => `${box(x, 92, 200, 34, title, "", { fill: "#ececea", bold: 1 })}` +
    items.map((t, i) => box(x + 14, 146 + i * 46, 172, 34, t, ids[i])).join("") +
    items.map((_, i) => arrow(`M${x + 6} ${126} V${163 + i * 46} H${x + 14}`)).join("");
  return `<svg viewBox="0 0 1040 400" role="img" aria-label="Sơ đồ màn hình theo vai trò">${DEFS}
    ${box(420, 14, 200, 44, "Đăng nhập", "S01 · mật khẩu hoặc SSO", { bold: 1 })}
    ${arrow("M470 58 V75 H130 V92")}${arrow("M520 58 V92")}${arrow("M570 58 V75 H910 V92")}
    ${lbl(300, 70, "vai trò sinh viên")}${lbl(560, 82, "giảng viên", false, "start")}${lbl(740, 70, "quản trị viên (tùy chọn)")}
    ${col(30, "Sinh viên", ["Hồ sơ của tôi", "Nhật ký", "Trợ lý AI", "Quy định"], ["S02 · S03 · S04", "S05", "S06", "S07"])}
    ${col(420, "Giảng viên", ["Hàng chờ duyệt", "Sinh viên", "Chi tiết hồ sơ", "Cảnh báo", "Trợ lý AI · Quy định"], ["S08", "S09", "S10 (từ S09, S11)", "S11", "S06 · S07"])}
    ${col(810, "Quản trị viên", ["Quản trị", "Danh sách", "Chi tiết (chỉ xem)", "Quy định · Trợ lý AI"], ["S12", "S13", "S10", "S07 · S06"])}
    ${arrow("M606 255 V280 H620", true)}${lbl(640, 252, "bấm tên SV", true, "start")}
    ${box(420, 386 - 30, 200, 30, "Thông báo (chuông)", "", { dash: 1 })}${lbl(630, 375, "S14 · có trên mọi màn sau đăng nhập", false, "start")}
  </svg>`;
}

function swimSVG() {
  const lanes = [["Sinh viên", 40], ["Hệ thống / AI", 130], ["Giảng viên", 220]];
  const L = lanes.map(([t, y]) => `<rect x="0" y="${y}" width="1040" height="86" fill="${y === 130 ? "#f6f6f4" : "#fff"}" stroke="#cfcfca"/><text x="12" y="${y + 47}" font-size="11" font-weight="700" fill="#1c1c1a">${t}</text>`).join("");
  return `<svg viewBox="0 0 1040 320" role="img" aria-label="Luồng chính đăng ký đến hoàn thành">${DEFS}${L}
    ${box(110, 58, 120, 50, "Khai báo hồ sơ", "S03")}
    ${box(110, 148, 120, 50, "AI trích xuất", "gợi ý + độ tin cậy", { dash: 1 })}
    ${box(260, 148, 120, 50, "Kiểm tra quy chế", "lỗi kèm căn cứ")}
    ${box(410, 238, 120, 50, "Duyệt hồ sơ", "S08 · HITL", { bold: 1 })}
    ${box(560, 148, 120, 50, "Sinh mốc", "từ mẫu của đợt")}
    ${box(560, 58, 120, 50, "Nộp mốc, nhật ký", "S04 · S05")}
    ${box(710, 148, 120, 50, "Giám sát", "nhắc việc, cảnh báo", { dash: 1 })}
    ${box(710, 58, 120, 50, "Xin gia hạn", "S04")}
    ${box(860, 238, 140, 50, "Duyệt mốc / gia hạn", "S08 · S10 · HITL", { bold: 1 })}
    ${arrow("M170 108 V148")}${arrow("M230 173 H260")}${arrow("M320 198 V263 H410")}${arrow("M530 263 H545 V173 H560")}
    ${arrow("M620 148 V108")}${arrow("M680 83 H710")}${arrow("M680 173 H710", true)}${arrow("M830 83 H930 V238")}${arrow("M770 198 V263 H860", true)}
    ${lbl(344, 236, "nộp")}${lbl(552, 236, "duyệt")}${lbl(700, 140, "sự kiện", true, "end")}${lbl(860, 226, "cảnh báo GV", true, "end")}
    ${lbl(1030, 314, "Khung đậm = con người quyết định (HITL) · nét đứt = AI / tác tử hệ thống · mũi tên đỏ = cảnh báo, nhắc việc", false, "end")}
  </svg>`;
}

/* ===== Dựng các tờ ===== */
const TOTAL = SCREENS.length + 2;
const foot = (n, title) => `<div class="foot"><span>${META.project} · ${title}</span><span>Tờ ${n}/${TOTAL} · v${META.version} · ${META.date}</span></div>`;

function coverSheet() {
  const legend = [
    [`<span class="btn btn--p btn--sm" style="font-size:7.5px">Nút chính</span>`, "Nút hành động chính (tô đậm); nút viền = phụ; viền nét đứt = hành động huỷ bỏ / từ chối"],
    [`<span class="inp" style="font-size:7.5px;width:46px;min-height:16px"></span>`, "Ô nhập; chữ xám nhạt = gợi ý; ▾ = danh sách chọn"],
    [`<span class="f ai" style="font-size:7.5px;width:46px"><span class="inp" style="min-height:16px"></span></span>`, "Ô do AI điền (viền đứt + gạch chéo + nhãn “AI điền”)"],
    [`<span class="aibox" style="font-size:7px;width:46px;height:20px;padding:2px"></span>`, "Nội dung do AI sinh — luôn chỉ là gợi ý"],
    [`<span class="badge" style="font-size:7.5px">Nhãn</span>`, "Nhãn trạng thái (chữ ghi rõ trạng thái; nền xám = đã xong)"],
    [`<span style="width:46px;display:flex;flex-direction:column;gap:3px">${bar(100)}${bar(70)}</span>`, "Đoạn văn bản dài (nội dung thật thay đổi theo dữ liệu)"],
    [`<span class="x x--av" style="font-size:7.5px"></span>`, "Ảnh / avatar / logo (ô có dấu X)"],
    [`<span class="mk" style="font-size:9px">1</span>`, "Chú thích thiết kế — số khớp danh sách bên phải mỗi tờ"],
  ].map(([sw, t]) => `<div><span class="sw">${sw}</span><span>${t}</span></div>`).join("");
  const rows = SCREENS.map((s) => `<tr><td><a href="#${s.id}">${s.id}</a></td><td>${s.name}</td><td>${ROLE[s.role]}</td><td style="font-family:var(--f-mono);font-size:9.5px">${s.route}</td><td class="fr">${[...new Set(s.notes.map((n) => n[2]).join(" · ").split(" · ").filter((x) => x !== "—"))].slice(0, 4).join(" · ")}</td></tr>`).join("");
  return `<section class="sheet" id="C00" data-title="Bìa">
    <div class="tb"><div><div class="tb__id">VIN-15</div><div class="tb__name">Wireframe Cổng thực tập</div></div>
      <dl class="tb__meta"><dt>Phiên bản</dt><dt>Ngày</dt><dt>Độ chi tiết</dt><dd>${META.version}</dd><dd>${META.date}</dd><dd>${META.fidelity}</dd></dl></div>
    <div class="cover">
      <div class="stack">
        <h1>Hệ thống hỗ trợ thực tập bằng AI</h1>
        <p>Bộ wireframe low-fidelity cho cổng thực tập: 14 màn của ba vai trò (Sinh viên, Giảng viên và Quản trị viên tùy chọn), mỗi màn có bản desktop (1440 px) và mobile (390 px). Bố cục vẽ lại từ frontend React đang chạy; chú thích đỏ trỏ về mã yêu cầu trong PRD.</p>
        <dl class="facts"><dt>Dự án</dt><dd>VIN-15 · Giáo dục Đại học &amp; Quản trị Học thuật</dd><dt>Nguồn</dt><dd>${META.source}</dd><dt>Tài liệu đi kèm</dt><dd>PRD.md · .kiro/specs/internship-ai-assistant/</dd><dt>Nguyên tắc</dt><dd>AI chỉ gợi ý; mọi phê duyệt do giảng viên (HITL)</dd></dl>
        <h2>Ký hiệu</h2><div class="legend">${legend}</div>
        <div class="howto"><b>Xuất PDF hoặc từng màn</b><ol><li>Mở file <code>docs/wireframe/export/vin15-wireframe-print.html</code> trong Chrome/Edge.</li><li>Ctrl + P → Lưu thành PDF · Khổ A4 · Hướng ngang · Lề mặc định · tắt “Đầu trang và chân trang” · bật “Đồ họa nền”.</li><li>Một màn: thêm <code>#S04</code> (mã màn) vào cuối địa chỉ rồi in như trên. Bản PDF và ảnh PNG từng màn đã có sẵn trong <code>docs/wireframe/export/</code>.</li></ol></div>
      </div>
      <div class="stack"><h2>Danh sách màn</h2><div class="index-wrap"><table class="index"><tr><th>Mã</th><th>Màn</th><th>Vai trò</th><th>Route</th><th>Yêu cầu chính</th></tr>${rows}</table></div></div>
    </div>${foot(1, "Bìa")}</section>`;
}

function flowSheet() {
  return `<section class="sheet" id="F00" data-title="Sơ đồ">
    <div class="tb"><div><div class="tb__id">F00</div><div class="tb__name">Sơ đồ màn hình và luồng chính</div><div class="tb__purpose">Trên: các màn theo vai trò (menu bên trái của từng vai trò). Dưới: luồng từ khai báo hồ sơ tới duyệt mốc, theo làn người và hệ thống.</div></div>
      <dl class="tb__meta"><dt>Phiên bản</dt><dt>Ngày</dt><dt>Độ chi tiết</dt><dd>${META.version}</dd><dd>${META.date}</dd><dd>${META.fidelity}</dd></dl></div>
    <div class="flow-wrap">${sitemapSVG()}${swimSVG()}</div>${foot(2, "Sơ đồ")}</section>`;
}

function screenSheet(s, i) {
  const notes = s.notes.map(([n, t, fr]) => `<li><span class="n">${n}</span><span>${t} <span class="fr">${fr}</span></span></li>`).join("");
  const url = s.route.startsWith("#") ? `https://cong-thuc-tap/${s.route.split(" ")[0]}` : "https://cong-thuc-tap/#/…";
  return `<section class="sheet" id="${s.id}" data-title="${s.name}">
    <div class="tb"><div><div class="row" style="gap:12px;align-items:baseline"><span class="tb__id">${s.id}</span><span class="tb__name">${s.name}</span></div><div class="tb__purpose">${s.purpose}</div></div>
      <dl class="tb__meta"><dt>Vai trò</dt><dt>Route</dt><dt>Độ chi tiết</dt><dd>${ROLE[s.role]}</dd><dd class="mono">${s.route}</dd><dd>${META.fidelity}</dd>
        <dt>Phiên bản</dt><dt>Ngày</dt><dt>Viewport</dt><dd>${META.version}</dd><dd>${META.date}</dd><dd>1440 · 390 px</dd></dl></div>
    <div class="body">
      <div class="col"><span class="col__label">Desktop · 1440 px</span><div class="dev dev--desk"><div class="chrome"><i></i><i></i><i></i><span class="url">${url}</span></div><div class="vp">${s.d()}</div></div></div>
      <div class="col"><span class="col__label">Mobile · 390 px</span><div class="dev dev--phone"><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="vp">${s.d()}</div></div></div>
      <div class="col notes"><span class="col__label">Chú thích</span><ol>${notes}</ol><div class="states"><b>Trạng thái khác:</b> ${s.states}</div></div>
    </div>${foot(i + 3, `${s.id} ${s.name}`)}</section>`;
}

const host = document.getElementById("sheets");
host.innerHTML = coverSheet() + flowSheet() + SCREENS.map(screenSheet).join("");

/* Ẩn toggle trùng: desktop đặt toggle dưới menu, mobile đặt cạnh logo */
const st = document.createElement("style");
st.textContent = `.side .hide-d{display:none} @container (max-width:320px){ .side .hide-d{display:inline-flex} .side .hide-m-only{display:none} }`;
document.head.appendChild(st);

/* Co nội dung cho vừa khung (mọi kích thước tính bằng em nên co đều), rồi đánh dấu khung còn bị cắt.
   Desktop co tới 58% để cả trang hiện đủ — chú thích không được trỏ vào phần bị khuất.
   Mobile chỉ co tới 80%: màn điện thoại dài thì giữ chữ đọc được và ghi "trang còn tiếp khi cuộn". */
const FIT = { "dev--desk": [8.6, 0.58], "dev--phone": [7.2, 0.8] };
function markCuts() {
  document.querySelectorAll(".dev").forEach((d) => {
    const vp = d.querySelector(".vp");
    const [base, min] = FIT[d.classList.contains("dev--desk") ? "dev--desk" : "dev--phone"];
    vp.style.fontSize = base + "px";
    for (let i = 0; i < 4 && vp.scrollHeight > vp.clientHeight + 2; i++) {
      const cur = parseFloat(vp.style.fontSize);
      const next = Math.max(base * min, cur * (vp.clientHeight / vp.scrollHeight) * 0.99);
      if (next >= cur - 0.01) break;
      vp.style.fontSize = next.toFixed(2) + "px";
    }
    d.classList.toggle("cut", vp.scrollHeight > vp.clientHeight + 4);
  });
}

/* Mục lục + xem riêng một màn bằng #mã */
const toc = document.getElementById("toc");
const ids = ["all", ...[...document.querySelectorAll(".sheet")].map((s) => s.id)];
toc.innerHTML = ids.map((id) => `<a href="#${id}" data-id="${id}">${id === "all" ? "Tất cả" : id}</a>`).join("");
function applyHash() {
  const id = (location.hash || "").slice(1);
  const solo = id && id !== "all" && document.getElementById(id);
  document.body.classList.toggle("solo", !!solo);
  document.querySelectorAll(".sheet").forEach((s) => s.classList.toggle("show", s.id === id));
  toc.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.id === (solo ? id : "all")));
  requestAnimationFrame(markCuts);
}
window.addEventListener("hashchange", applyHash);
window.addEventListener("resize", () => requestAnimationFrame(markCuts));
window.addEventListener("beforeprint", markCuts);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(markCuts));
applyHash();
</script>
